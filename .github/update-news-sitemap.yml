name: Sync Google Sheet to GitHub

on:
  repository_dispatch:
    types: [news_updated]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-sheet-to-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install generator dependency
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: Sync News and Ads from Google Sheet
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          for i in 1 2 3; do
            python3 generate_static_news.py && break
            if [ "$i" -eq 3 ]; then
              echo "Sync failed after 3 attempts."
              exit 1
            fi
            echo "Sync attempt $i failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Validate every Sheet news row has a static page
        run: |
          test -s news-data.json
          test -s ads-data.json
          test -s sitemap.xml
          test -s news-sitemap.xml
          python3 - <<'PY2'
          import json, re
          with open("news-data.json", encoding="utf-8") as f:
              rows=json.load(f).get("table",{}).get("rows",[])
          ids=[]
          for i,row in enumerate(rows,1):
              c=row.get("c",[])
              v=lambda n: str(c[n].get("v","") or "").strip() if n < len(c) and c[n] else ""
              raw=v(0) or str(i)
              m=re.fullmatch(r"(\d+)\.0+", raw)
              if m: raw=m.group(1)
              sid=re.sub(r"[^A-Za-z0-9_-]+","-",raw).strip("-") or "article"
              if v(2): ids.append(sid)
          missing=[x for x in dict.fromkeys(ids) if not __import__("pathlib").Path("news",x+".html").is_file()]
          if missing: raise SystemExit("Missing static news pages: "+", ".join(missing))
          pages=list(__import__("pathlib").Path("news").glob("*.html"))
          if not pages: raise SystemExit("No static news pages generated")
          for p in pages:
              t=p.read_text(encoding="utf-8",errors="ignore")
              for needle in ('home-main-layout','home-sidebar','category-six-grid','article-full-details'):
                  assert needle in t, f"{p} missing {needle}"
          print(f"Validated {len(pages)} static news pages.")
          PY2

      - name: Commit generated data and SEO output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news sitemap.xml news-sitemap.xml news-data.json ads-data.json news-media
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Sync Google Sheet news and ads"
            git push
          fi

      - name: Trigger social auto-publish after successful sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run auto-publish.yml --ref main
